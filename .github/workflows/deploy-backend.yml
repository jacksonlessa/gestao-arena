name: Deploy backend

# Publica APENAS quando o backend muda (RF26). Sem este filtro, um commit em
# documentação reiniciaria o backend em produção — com arena real usando a
# agenda, isso é indisponibilidade sem motivo.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/deploy/**'
  workflow_dispatch:

# Um deploy por vez. Pushes seguidos entram na fila (o mais novo substitui o
# que estiver esperando); um deploy em andamento nunca é cancelado no meio.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Mesma versão major do Node do droplet. O script remoto confere e aborta
  # antes de tocar em produção se divergir. Manter igual ao backend-ci.yml.
  NODE_VERSION: '24'
  # Relativo ao $HOME do usuário de deploy (entretimes-deploy) no droplet.
  REMOTE_BASE_DIR: apps/gestao-arena-api
  PUBLIC_URL: https://arenas-api.entretimes.com.br

jobs:
  # Teste vermelho impede a publicação (RF27).
  qualidade:
    uses: ./.github/workflows/backend-ci.yml

  publicar:
    name: Build and deploy to droplet
    needs: qualidade
    # Versão fixa (não ubuntu-latest): node_modules e engines do Prisma saem
    # compilados para esta plataforma (x86_64, OpenSSL 3), a mesma do droplet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ---- Build: tudo no runner, nada no droplet ---------------------------

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      # O CLI do Prisma é devDependency e sai no prune abaixo, mas o droplet
      # precisa dele para o `migrate deploy`. Vai numa pasta à parte, na mesma
      # versão do projeto, sem mexer no package.json.
      - name: Bundle Prisma CLI for the droplet
        run: |
          PRISMA_VERSION="$(node -p "require('./node_modules/prisma/package.json').version")"
          mkdir -p .deploy-tools/prisma
          echo '{ "private": true }' > .deploy-tools/prisma/package.json
          npm install --prefix .deploy-tools/prisma --no-audit --no-fund "prisma@${PRISMA_VERSION}"

      - run: npm prune --omit=dev

      - name: Package release
        id: package
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "$GITHUB_SHA" > REVISION
          tar -czf "$RUNNER_TEMP/$RELEASE_ID.tgz" \
            --exclude='node_modules/.cache' \
            dist node_modules prisma package.json package-lock.json .deploy-tools REVISION
          du -h "$RUNNER_TEMP/$RELEASE_ID.tgz"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      # ---- Deploy ------------------------------------------------------------

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          # Espaço ou quebra de linha colados junto no secret quebram o ssh.
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')"
          DEPLOY_PORT="$(printf '%s' "$DEPLOY_PORT" | tr -d '[:space:]')"
          for s in SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            [ -n "${!s}" ] || { echo "::error::Secret ausente: ${s/SSH_KEY/DEPLOY_SSH_KEY}"; exit 1; }
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # O que importa no DEPLOY_KNOWN_HOSTS é a CHAVE, não como o host foi
          # escrito (IP, hostname, [host]:porta, hash do ssh-keyscan -H ou só
          # "tipo chave"). Cada chave vira "droplet <tipo> <chave>" e o ssh
          # procura por esse alias (HostKeyAlias abaixo). A verificação continua
          # estrita: só as chaves do secret são aceitas.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | awk '
              /^[[:space:]]*(#|$)/ { next }
              { for (i = 1; i < NF; i++) if ($i ~ /^(ssh-|ecdsa-|sk-)/) { print "droplet", $i, $(i + 1); break } }
            ' > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "::error::DEPLOY_KNOWN_HOSTS não contém nenhuma chave reconhecível (esperado: linhas '<host> ssh-ed25519 AAAA...')."; exit 1; }
          else
            echo "::warning::Secret DEPLOY_KNOWN_HOSTS não configurado: a chave do droplet está sendo aceita sem verificação (ssh-keyscan)."
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" 2>/dev/null | awk '{ print "droplet", $2, $3 }' > ~/.ssh/known_hosts
          fi
          echo "Chaves do droplet aceitas (impressões digitais):"
          ssh-keygen -lf ~/.ssh/known_hosts

          cat > ~/.ssh/config <<SSHCONFIG
          Host droplet
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            HostKeyAlias droplet
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          SSHCONFIG
          chmod 600 ~/.ssh/config

          # Testa a conexão aqui, com diagnóstico, antes de qualquer envio.
          if ! ssh droplet true 2> "$RUNNER_TEMP/ssh_err.txt"; then
            cat "$RUNNER_TEMP/ssh_err.txt"
            echo "Chaves que o droplet apresenta agora:"
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" 2>/dev/null | ssh-keygen -lf - || true
            if grep -q "Host key verification failed" "$RUNNER_TEMP/ssh_err.txt"; then
              echo "::error::A chave do droplet não bate com DEPLOY_KNOWN_HOSTS. Compare as impressões digitais das duas listas acima e regere o secret no droplet (.github/deploy/README.md)."
            elif grep -q "Permission denied" "$RUNNER_TEMP/ssh_err.txt"; then
              echo "::error::O droplet recusou a chave: a pública de DEPLOY_SSH_KEY não está em ~$DEPLOY_USER/.ssh/authorized_keys, ou DEPLOY_USER está errado."
            else
              echo "::error::Falha de conexão SSH com o droplet (host, porta ou firewall)."
            fi
            exit 1
          fi
          echo "Conexão SSH ok."

      - name: Upload release to droplet
        env:
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          # shellcheck disable=SC2029 # expansão local proposital (REMOTE_BASE_DIR)
          ssh droplet "mkdir -p \"\$HOME/$REMOTE_BASE_DIR/incoming\""
          scp -q "$RUNNER_TEMP/$RELEASE_ID.tgz" ../.github/deploy/remote-deploy.sh \
            "droplet:$REMOTE_BASE_DIR/incoming/"

      - name: Activate release (migrate, switch, healthcheck, rollback)
        env:
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          # shellcheck disable=SC2029 # expansão local proposital (RELEASE_ID, NODE_VERSION)
          ssh droplet "BASE_DIR=\"\$HOME/$REMOTE_BASE_DIR\" bash \"\$HOME/$REMOTE_BASE_DIR/incoming/remote-deploy.sh\" '$RELEASE_ID' '${NODE_VERSION%%.*}'"

      # O script remoto já validou o /health pela porta local. Este passo prova
      # o caminho público inteiro: DNS, Nginx, TLS. Falhar aqui com o passo
      # anterior verde = aplicação no ar, mas algo na frente dela quebrado.
      - name: Public healthcheck
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "$PUBLIC_URL/health" | jq -e '.status == "ok"' > /dev/null; then
              echo "Healthcheck público ok"; exit 0
            fi
            sleep 6
          done
          echo "::error::$PUBLIC_URL/health não respondeu status \"ok\". A aplicação passou no healthcheck local do droplet — confira DNS, Nginx e TLS."
          exit 1
